- name: Configure Access Layer
  hosts: access
  gather_facts: no

  tasks:
    - name: Create VLANs
      ios_config:
        lines:
          - "vlan {{ item.id }}"
          - "name {{ item.name }}"
      loop: "{{ vlans }}"

    - name: Configure access ports
      ios_config:
        parents: "interface {{ item.name }}"
        lines:
          - "switchport mode {{ item.mode }}"
          - "switchport access vlan {{ item.vlan }}"
      loop: "{{ interfaces }}"